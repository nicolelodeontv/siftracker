name: Apply manual Clock In

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-manual-clockin.yml'

authors: permissions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Clock In editable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''<div className="mt-1.5 rounded-md border border-input bg-background px-2 py-2 text-center font-mono text-sm font-bold tabular-nums">{clockInTime}</div>
              <div className="mt-2 flex justify-center">
                <button type="button" onClick={handleClockNow} className="rounded-full border border-border bg-card px-5 py-2 text-[10px] font-bold shadow-sm transition hover:border-primary/40 hover:bg-accent">NOW · {philippineTime}</button>
              </div>'''
          new = '''<div className="mt-1.5 rounded-md border border-input bg-background px-2 py-1.5">
                <input
                  type="text"
                  inputMode="numeric"
                  autoComplete="off"
                  value={clockInTime}
                  onChange={(event) => setClockInTime(event.target.value.replace(/[^0-9:]/g, '').slice(0, 8))}
                  placeholder="HH:MM:SS"
                  className="w-full bg-transparent text-center font-mono text-sm font-bold tabular-nums outline-none"
                  aria-label="Manual Clock In time"
                />
              </div>
              <div className="mt-2 flex justify-center">
                <button type="button" onClick={handleClockNow} className="rounded-full border border-border bg-card px-5 py-2 text-[10px] font-bold shadow-sm transition hover:border-primary/40 hover:bg-accent">NOW · {philippineTime}</button>
              </div>'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'aria-label="Manual Clock In time"' in s:
              print('Manual Clock In already applied')
          else:
              raise SystemExit('Clock In source block not found')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Make Clock In manually editable'
          git push
